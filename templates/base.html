<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}自然场景图像去噪系统{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar__container">
            <a href="/" class="navbar__logo">DenoiseLab</a>
            <ul class="navbar__links">
                <li><a href="/" class="{{ 'active' if active_page == 'index' }}">首页</a></li>
                <li><a href="/denoise" class="{{ 'active' if active_page == 'denoise' }}">去噪对比</a></li>
                <li><a href="/evaluate" class="{{ 'active' if active_page == 'evaluate' }}">性能评估</a></li>
            </ul>
            <button class="navbar__toggle" aria-label="菜单">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <p>&copy; 2026 自然场景图像去噪系统 | 基于 MASH 的多方法对比平台</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
